<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Redirect to index.html with hash for HashRouter
        const path = window.location.pathname;
        const repo = '/bio/';
        if (path.startsWith(repo)) {
            const subPath = path.replace(repo, '');
            if (subPath) {
                window.location.replace(repo + '#/' + subPath);
            } else {
                window.location.replace(repo);
            }
        } else {
            window.location.replace(repo);
        }
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
